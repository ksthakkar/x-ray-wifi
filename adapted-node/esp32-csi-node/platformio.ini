; PlatformIO Project Configuration File
;
; Classic ESP32 port of the ruview-reference-node CSI firmware.
; All classic-ESP32-specific settings (target=esp32, 4MB flash/partitions,
; display+LED-viz disabled) are baked directly into sdkconfig.defaults —
; PlatformIO only reliably auto-applies a single file with that exact name
; (confirmed against test-node/platformio.ini, which relies on the same
; single-file behavior), so no separate overlay file is loaded here.
; sdkconfig.defaults.esp32-classic is kept alongside as the equivalent
; overlay for anyone building with plain idf.py instead of PlatformIO.
;
; https://docs.platformio.org/page/projectconf.html

; This project uses ESP-IDF's native component layout (main/ with its own
; CMakeLists.txt + idf_component_register, driven by the root CMakeLists.txt)
; instead of PlatformIO's default src/ glob layout — same structure as the
; ruview-reference-node tree. Point PlatformIO at main/ so it doesn't expect
; a src/ directory to exist.
[platformio]
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; Automatically compile Kconfig options
board_build.configurations = sdkconfig.defaults
