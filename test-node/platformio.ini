; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Pick the environment matching your board with `pio run -e <env>`.
; See the "Identifying which board you have" section in the root README.

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.configurations = sdkconfig.defaults
; Expected channel of the transmitter, for the mismatch check only.
build_flags = -DCSI_CHANNEL=11


[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.configurations = sdkconfig.defaults
; Expected channel of the transmitter, for the mismatch check only.
build_flags = -DCSI_CHANNEL=11


[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.configurations = sdkconfig.defaults
; Expected channel of the transmitter, for the mismatch check only.
build_flags = -DCSI_CHANNEL=11


; ---------------------------------------------------------------------------
; TRANSMITTER roles. Flash ONE board with one of these; it broadcasts ESP-NOW
; frames at a fixed rate so the receivers' CSI rate is controlled rather than
; dependent on ambient traffic. CSI_CHANNEL must match the receivers.
;
; CSI_CHANNEL must be 1-14: ESP32 Wi-Fi is 2.4 GHz ONLY. If `netsh wlan show
; interfaces` reports a channel >= 36 your PC is on 5 GHz, which these boards
; cannot see at all -- the receivers must join a 2.4 GHz SSID.
; ---------------------------------------------------------------------------
[env:tx-esp32]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.configurations = sdkconfig.defaults
build_flags = -DCSI_ROLE=CSI_ROLE_TX -DCSI_CHANNEL=11 -DCSI_TX_INTERVAL_MS=20

[env:tx-esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.configurations = sdkconfig.defaults
build_flags = -DCSI_ROLE=CSI_ROLE_TX -DCSI_CHANNEL=11 -DCSI_TX_INTERVAL_MS=20
